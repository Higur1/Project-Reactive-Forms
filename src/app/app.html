<div class="p-4 max-w-screen-xl mx-auto">
    <mat-card>
        <mat-card-content>
            <app-users-list [usersList]="usersList"></app-users-list>
            <mat-tab-group [(selectedIndex)]="currentTabIndex">
                <mat-tab label="General">
                    <app-general-informations [user]="usersList[0]"></app-general-informations>
                </mat-tab>
                <mat-tab label="Contact">
                    <app-contact-informations [user]="usersList[0]"></app-contact-informations>
                </mat-tab>
                <mat-tab label="Depentent">
                    <app-user-dependents-list [dependentsList]="usersList[0]?.dependentsList"></app-user-dependents-list>
                </mat-tab>
            </mat-tab-group>
        </mat-card-content>
    </mat-card>
</div>
