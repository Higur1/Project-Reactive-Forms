<div class="p-4 max-w-screen-xl mx-auto">
    <mat-card>
        <mat-card-content>
            <app-users-list *ngIf="usersList$ | async as usersList; else loading" [usersList]="usersList"
                (onUserSelected)="onUserSelected($event, usersList)">
            </app-users-list>

            <ng-template #loading></ng-template>
            <app-buttons-conteiners [isInEditMode]="isInEditMode" (onEditButton)="onEditButton()"
                (onCancelButton)="onCancelButton()" *ngIf="userSelected"></app-buttons-conteiners>
            <mat-tab-group [selectedIndex]="currentTabIndex" (selectedIndexChange)="currentTabIndex = $event"
                *ngIf="userSelected">
                <mat-tab label="General">
                    <app-general-informations [user]="userSelected"></app-general-informations>
                </mat-tab>
                <mat-tab label="Contact">
                    <app-contact-informations [user]="userSelected"></app-contact-informations>
                </mat-tab>
                <mat-tab label="Dependent">
                    <app-user-dependents-list [dependentsList]="userSelected.dependentsList"></app-user-dependents-list>
                </mat-tab>
            </mat-tab-group>
        </mat-card-content>
    </mat-card>
</div>
