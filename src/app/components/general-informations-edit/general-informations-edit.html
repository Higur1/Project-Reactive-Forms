<div class="p-4 grid gap-4">
    <div class="grid lg:grid-cols3 grp-4">
        <mat-form-field class="w-full">
            <mat-label>Name:</mat-label>
            <input matInput placeholder="Example Name">
        </mat-form-field>
        <mat-form-field class="w-full">
            <mat-label>Email:</mat-label>
            <input matInput placeholder="Example@email.com">
        </mat-form-field>
    </div>
    <div class="grid lg:grid-cols3 grp-4">
        <mat-form-field class="w-full">
            <mat-label>Country</mat-label>
            <input type="text" placeholder="Brazil" matInput [matAutocomplete]="autoCounrty">
            <mat-autocomplete #autoCounrty="matAutocomplete">
                <mat-option *ngFor="let option of []">{{ '' }}</mat-option>
            </mat-autocomplete>
        </mat-form-field>
        <mat-form-field class="w-full">
            <mat-label>State</mat-label>
            <input type="text" placeholder="São Paulo" matInput [matAutocomplete]="autoState">
            <mat-autocomplete #autoState="matAutocomplete">
                <mat-option *ngFor="let option of []">{{ '' }}</mat-option>
            </mat-autocomplete>
        </mat-form-field>

    </div>
    <div class="grid lg:grid-cols3 grp-4">
        <div class="w-full">
            <div class="text-lg">Marital Status</div>
            <mat-radio-group class="w-full flex flex-col sm:flex-row sm:justify-between">
                <mat-radio-button value="1">Single</mat-radio-button>
                <mat-radio-button value="2">Married</mat-radio-button>
                <mat-radio-button value="3">Divorced</mat-radio-button>
            </mat-radio-group>
        </div>
        <mat-form-field class="w-full">
            <mat-label>Monthly Income:</mat-label>
            <input matInput placeholder="U$1000,00">
        </mat-form-field>
        <mat-form-field>
            <mat-label>Date of birth:</mat-label>
            <input matInput [matDatepicker]="picker">
            <mat-hint>MM/DD/YYYY</mat-hint>
            <mat-datepicker-toggle matIconSuffix [for]="picker"></mat-datepicker-toggle>
            <mat-datepicker #picker></mat-datepicker>
        </mat-form-field>
    </div>
</div>
