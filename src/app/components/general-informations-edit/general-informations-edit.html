<form [formGroup]="userForm" class="p-4 grid gap-4">
    <ng-container formGroupName="generalInformations">
        <div class="grid lg:grid-cols3 grp-4">
            <mat-form-field class="w-full">
                <mat-label>Name:</mat-label>
                <input matInput placeholder="Example Name" formControlName="name">
                <mat-error>The Name field is required.</mat-error>
            </mat-form-field>
            <mat-form-field class="w-full">
                <mat-label>Email:</mat-label>
                <input matInput placeholder="Example@email.com" formControlName="email">
                <mat-error *ngIf="emailControl.hasError('required')">Email is required</mat-error>
                <mat-error *ngIf="emailControl.hasError('pattern')">Enter a valid email address</mat-error>
            </mat-form-field>
        </div>
        <div class="grid lg:grid-cols3 grp-4">
            <mat-form-field class="w-full">
                <mat-label>Country</mat-label>
                <input type="text" placeholder="Brazil" matInput [matAutocomplete]="autoCountry"
                    formControlName="country">
                <mat-autocomplete #autoCountry="matAutocomplete" (optionSelected)="onCountrySelected($event)">
                    <mat-option *ngFor="let country of countriesListFiltered" [value]="country.name">{{ country.name
                        }}</mat-option>
                </mat-autocomplete>
            </mat-form-field>
            <mat-form-field class="w-full">
                <mat-label>State</mat-label>
                <input type="text" placeholder="São Paulo" matInput [matAutocomplete]="autoState"
                    formControlName="state">
                <mat-autocomplete #autoState="matAutocomplete">
                    <mat-option *ngFor="let state of statesListFiltered" [value]="state.name">{{ state.name
                        }}</mat-option>
                </mat-autocomplete>
            </mat-form-field>
        </div>
        <div class="grid lg:grid-cols3 grp-4">
            <div class="w-full">
                <div class="text-lg">Marital Status</div>
                <mat-radio-group class="w-full flex flex-col sm:flex-row sm:justify-between"
                    formControlName="maritalStatus">
                    <mat-radio-button [value]="1">Single</mat-radio-button>
                    <mat-radio-button [value]="2">Married</mat-radio-button>
                    <mat-radio-button [value]="3">Divorced</mat-radio-button>
                </mat-radio-group>
            </div>
            <mat-form-field class="w-full">
                <mat-label>Monthly Income:</mat-label>
                <input matInput placeholder="U$1000,00" formControlName="monthlyIncome">
            </mat-form-field>
            <mat-form-field>
                <mat-label>Date of birth:</mat-label>
                <input matInput [matDatepicker]="picker" formControlName="birthDate">
                <mat-hint>MM/DD/YYYY</mat-hint>
                <mat-datepicker-toggle matIconSuffix [for]="picker"></mat-datepicker-toggle>
                <mat-datepicker #picker></mat-datepicker>
            </mat-form-field>
        </div>
    </ng-container>
</form>
