<form [formGroup]="userForm">
    <p class="text-2xl font-semibold">Address:</p>
    <ng-container formGroupName="contactInformations">
        <ng-container formArrayName="addressList">
            <ng-container *ngFor="let address of addressList.controls; let i = index" [formGroupName]="i">
                <div class=" my-4 grid sm:grid-cols-2 sm:gap-4 lg:grid-cols-6">
                    <mat-form-field class="w-full">
                        <mat-label>Type:</mat-label>
                        <input matInput formControlName="typeDescription">
                    </mat-form-field>
                    <mat-form-field class="w-full">
                        <mat-label>Street:</mat-label>
                        <input matInput formControlName="street">
                    </mat-form-field>
                    <mat-form-field class="w-full">
                        <mat-label>Complement:</mat-label>
                        <input matInput formControlName="complement">
                    </mat-form-field>
                    <mat-form-field class="w-full">
                        <mat-label>Country:</mat-label>
                        <input matInput formControlName="country">
                    </mat-form-field>
                    <mat-form-field class="w-full">
                        <mat-label>State:</mat-label>
                        <input matInput formControlName="state">
                    </mat-form-field>
                    <mat-form-field class="w-full">
                        <mat-label>City:</mat-label>
                        <input matInput formControlName="city">
                    </mat-form-field>
                </div>

                <hr class="block lg:hidden" />
            </ng-container>
        </ng-container>
    </ng-container>
</form>
