<p class="text-2xl font-semibold">Phones:</p>
<form class="my-4 grid lg:grid-cols-3 lg:gap-4" [formGroup]="userForm">
    <ng-container formGroupName="contactInformations">
        <ng-containter formArrayName="phoneList">
            <mat-form-field class="w-full" *ngFor="let phone of phoneList.controls; let i = index" [formGroupName]="i">
                <mat-label>{{ phoneList.value[i].typeDescription }}</mat-label>
                <input matInput [placeholder]="phoneList.value[i].value | phonePlaceholder"
                    [mask]="phoneList.value[i].type | phoneMask" formControlName="number">
            </mat-form-field>
        </ng-containter>
    </ng-container>
</form>
