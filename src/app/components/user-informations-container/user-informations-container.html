<mat-tab-group [selectedIndex]="currentTabIndex" (selectedIndexChange)="currentTabIndex = $event">
    <mat-tab label="General">
        <app-general-informations *ngIf="!isInEditMode" [user]="userSelected"></app-general-informations>
        <ng-container *ngIf="countriesList$ | async as countries">
            <ng-container *ngIf="statesList$ | async as states">
                <app-general-informations-edit *ngIf="isInEditMode" [userForm]="userForm" [countriesList]="countries"
                    [statesList]="states" (onCountrySelected)="onCountrySelected($event)">
                </app-general-informations-edit>
            </ng-container>
        </ng-container>
    </mat-tab>
    <ng-template #loading></ng-template>

    <mat-tab label="Contact">
        <app-contact-informations [user]="userSelected"></app-contact-informations>
        <app-contact-informations-edit [userForm]="userForm"></app-contact-informations-edit>
    </mat-tab>
    <mat-tab label="Dependent">
        <app-user-dependents-list [dependentsList]="userSelected.dependentsList"></app-user-dependents-list>
        <app-user-dependents-list-edit></app-user-dependents-list-edit>
    </mat-tab>
</mat-tab-group>
