<mat-tab-group [selectedIndex]="currentTabIndex" (selectedIndexChange)="currentTabIndex = $event">
    <mat-tab>
        <ng-template mat-tab-label>
            General
            <mat-icon class="red-circle-icon" color="warn"
                *ngIf="isInEditMode && !generalInformationsValid">circle</mat-icon>
        </ng-template>

        <app-general-informations *ngIf="!isInEditMode" [user]="userSelected"></app-general-informations>
        <ng-container *ngIf="countriesList$ | async as countries">
            <ng-container *ngIf="statesList$ | async as states">
                <app-general-informations-edit *ngIf="isInEditMode" [userForm]="userForm" [countriesList]="countries"
                    [statesList]="states" (onCountrySelected)="onCountrySelected($event)">
                </app-general-informations-edit>
            </ng-container>
        </ng-container>
    </mat-tab>
    <ng-template #loading></ng-template>

    <mat-tab>
        <ng-template mat-tab-label>
            Contact
            <mat-icon class="red-circle-icon" color="warn"
                *ngIf="isInEditMode && !contactInformationValid">circle</mat-icon>
        </ng-template>

        <app-contact-informations *ngIf="!isInEditMode" [user]="userSelected"></app-contact-informations>
        <app-contact-informations-edit *ngIf="isInEditMode" [userForm]="userForm"></app-contact-informations-edit>
    </mat-tab>
    <mat-tab>
        <ng-template mat-tab-label>
            Dependent
            <mat-icon class="red-circle-icon" color="warn"
                *ngIf="isInEditMode && !dependentsListValid">circle</mat-icon>
        </ng-template>
        <app-user-dependents-list *ngIf="!isInEditMode"
            [dependentsList]="userSelected.dependentsList"></app-user-dependents-list>
        <app-user-dependents-list-edit *ngIf="isInEditMode" [userForm]="userForm" (onAddDependent)="addDependent()"
            (onRemoveDependent)="removeDependent($event)"></app-user-dependents-list-edit>
    </mat-tab>
</mat-tab-group>
