<div *ngFor="let dependent of dependentsList">
    <p class="text-2xl font-semibold">Dependents:</p>
    <div class="grid sm:grid-cols-3">
        <app-user-info-item title="Name" [text]="dependent?.name"></app-user-info-item>
        <app-user-info-item title="Age" [text]="dependent?.age?.toString()"></app-user-info-item>
        <app-user-info-item title="Document" [text]="dependent?.document?.toString()"></app-user-info-item>
    </div>
</div>
